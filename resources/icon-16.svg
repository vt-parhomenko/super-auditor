<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!--
    Super Auditor — майстер 16 px (ручний хінтинг).
    Усі прямі краї на цілих пікселях; галочку намальовано попіксельно
    сходинками по 2 px, бо згладжений штрих у 1 px на такому розмірі
    розпливається в сіру пляму.
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5383f5"/>
      <stop offset="1" stop-color="#2449b4"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="14" height="14" rx="3" fill="url(#tile)"/>

  <path d="M3 2H7L9 4V12H3A1 1 0 0 1 2 11V3A1 1 0 0 1 3 2Z" fill="#ffffff"/>
  <path d="M7 2V4H9Z" fill="#bcd0f7"/>
  <rect x="3" y="4" width="3" height="1" fill="#2f5fd0"/>
  <rect x="3" y="6" width="3" height="1" fill="#25b47a"/>

  <circle cx="10" cy="10" r="5" fill="#ffffff"/>
  <circle cx="10" cy="10" r="4" fill="#14a46c"/>
  <g fill="#ffffff" shape-rendering="crispEdges">
    <rect x="7" y="9" width="1" height="2"/>
    <rect x="8" y="10" width="1" height="2"/>
    <rect x="9" y="9" width="1" height="2"/>
    <rect x="10" y="8" width="1" height="2"/>
    <rect x="11" y="7" width="1" height="2"/>
  </g>
</svg>
