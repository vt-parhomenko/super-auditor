<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    Super Auditor — майстер 24 px (панель задач Windows 11 при масштабі 100 %).
    Власна сітка на 24 одиниці: майстер 32 px, зменшений у 0,75 раза, поклав би
    краї плитки й аркуша на пів пікселя і розмив би їх.
    Цю ж геометрію повторює знак у сайдбарі (src/renderer/src/components/BrandMark.tsx).
  -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5383f5"/>
      <stop offset="1" stop-color="#2449b4"/>
    </linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2fcf8e"/>
      <stop offset="1" stop-color="#0c9360"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="22" height="22" rx="5" fill="url(#tile)"/>

  <path d="M4.5 3H12L15 6V17.5A1.5 1.5 0 0 1 13.5 19H4.5A1.5 1.5 0 0 1 3 17.5V4.5A1.5 1.5 0 0 1 4.5 3Z" fill="#ffffff"/>
  <path d="M12 3V5A1 1 0 0 0 13 6H15Z" fill="#bcd0f7"/>
  <rect x="5" y="6" width="5" height="2" rx="1" fill="#2f5fd0"/>
  <rect x="5" y="10" width="6" height="2" rx="1" fill="#25b47a"/>
  <rect x="5" y="14" width="4" height="1" fill="#b7c6e6"/>

  <circle cx="15.5" cy="15.5" r="6" fill="#ffffff"/>
  <circle cx="15.5" cy="15.5" r="4.5" fill="url(#seal)"/>
  <path d="M13.2 15.6L14.9 17.3L18 14.1" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
